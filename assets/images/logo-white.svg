<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5100"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <linearGradient id="mountainGradW1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="mountainGradW2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="greenAccentW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- Group: Logo Graphic Icon (Left) -->
  <g transform="translate(10, 10)">
    <!-- Drone Quadcopter Top -->
    <g transform="translate(65, 12)">
      <rect x="-10" y="4" width="20" height="9" rx="3" fill="#E2E8F0"/>
      <rect x="-5" y="13" width="10" height="5" rx="1.5" fill="#38BDF8"/>
      <circle cx="0" cy="15.5" r="2" fill="#FFFFFF"/>
      <path d="M-28 -4 L-10 6 L10 6 L28 -4" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <line x1="-34" y1="-5" x2="-22" y2="-5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-28" cy="-4" r="2" fill="#FF7A00"/>
      <line x1="22" y1="-5" x2="34" y2="-5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="28" cy="-4" r="2" fill="#FF7A00"/>
    </g>

    <!-- Mountains / Topo background -->
    <g transform="translate(20, 48)">
      <polygon points="45,28 18,65 72,65" fill="url(#mountainGradW1)"/>
      <polygon points="26,42 0,65 52,65" fill="url(#mountainGradW2)"/>
      <polygon points="62,38 38,65 86,65" fill="#38BDF8" opacity="0.9"/>
      <polygon points="45,28 38,38 43,36 47,39 52,38" fill="#FFFFFF"/>
      <path d="M-5,65 Q45,55 95,65 L95,70 L-5,70 Z" fill="url(#greenAccentW)"/>
    </g>

    <!-- Stylized "R" in Orange Gradient -->
    <path d="M42 28 C42 28, 55 24, 74 24 C92 24, 102 34, 102 48 C102 60, 93 68, 80 70 L102 96 L82 96 L64 74 L58 74 L58 96 L42 96 Z M58 40 L58 60 C64 60, 84 61, 84 49 C84 40, 67 40, 58 40 Z" fill="url(#orangeGradW)"/>

    <!-- Left: Total Station on Tripod -->
    <g transform="translate(18, 52)">
      <line x1="12" y1="20" x2="3" y2="46" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="12" y1="20" x2="12" y2="46" stroke="#E2E8F0" stroke-width="2"/>
      <line x1="12" y1="20" x2="21" y2="46" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="7" y="10" width="10" height="10" rx="1.5" fill="#22C55E"/>
      <circle cx="12" cy="15" r="3" fill="#0F172A"/>
      <rect x="9" y="4" width="6" height="6" fill="#F59E0B"/>
      <circle cx="12" cy="7" r="1.5" fill="#EF4444"/>
    </g>

    <!-- Right: GNSS / DGPS Rover Pole -->
    <g transform="translate(90, 48)">
      <line x1="15" y1="18" x2="15" y2="50" stroke="#CBD5E1" stroke-width="2.5"/>
      <rect x="8" y="30" width="8" height="11" rx="1" fill="#0F172A"/>
      <rect x="9.5" y="31.5" width="5" height="8" rx="0.5" fill="#38BDF8"/>
      <ellipse cx="15" cy="16" rx="9" ry="4" fill="#F8FAFC"/>
      <path d="M7 16 C7 11, 23 11, 23 16 Z" fill="#EF4444"/>
    </g>
  </g>

  <!-- Group: Typography (Right) -->
  <g transform="translate(155, 30)">
    <text x="0" y="52" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="3">RELIABLE</text>
    <text x="3" y="85" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="27" fill="#38BDF8" letter-spacing="4.5">LAND SURVEY</text>
    <g transform="translate(3, 98)">
      <line x1="0" y1="0" x2="120" y2="0" stroke="#FF7A00" stroke-width="2.5"/>
      <polygon points="127,-4 135,0 127,4 119,0" fill="#FF7A00"/>
      <line x1="134" y1="0" x2="310" y2="0" stroke="#38BDF8" stroke-width="2.5"/>
    </g>
    <text x="5" y="125" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="700" font-size="18" fill="#E2E8F0" letter-spacing="8.5">CONSULTANCY</text>
    <rect x="5" y="136" width="168" height="18" rx="9" fill="rgba(255,255,255,0.15)"/>
    <text x="14" y="149" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#38BDF8" letter-spacing="1.5">PUNE, MAHARASHTRA</text>
  </g>
</svg>
